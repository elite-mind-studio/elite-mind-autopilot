# Weekly learning loop (our own analytics -> research/lessons.json) and viral research: finds outlier videos in our niches and adds the best
# matching topic ideas to the front of the queues. Report in research/report.md.
name: Research

on:
  # Started by Vercel Cron (dashboard/vercel.json -> api/trigger.js): GitHub's own
  # schedule trigger dropped most runs, so it is not used.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autopilot   # never edit topic files while a video is being made
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TEXT_PROVIDERS: "groq,cloudflare"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv sync --python 3.11

      - name: Write YouTube credentials
        env:
          CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
        run: |
          printf '%s' "$CLIENT_SECRET_JSON" > Backend/client_secret.json
          printf '%s' "$OAUTH_JSON" > Backend/youtube-oauth2.json

      - name: Learn from our own videos' analytics
        run: uv run python Backend/learning.py
        continue-on-error: true   # research still runs if analytics is unavailable

      - name: Research and update topic queues
        run: uv run python Backend/research.py --apply

      - name: Commit report and topics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/report.md research/lessons.json research/learning.md topics.txt topics_long.txt topics_series.txt
          git commit -m "research: weekly viral report and topic ideas" || exit 0
          git pull --rebase --autostash  # other files the run touched must not block the commit
          git push

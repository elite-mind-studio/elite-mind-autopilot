# Generates one video from topics.txt and uploads it to YouTube.
# Three Shorts a day (explainers morning and midday, a series part in the evening) and a long video on Fridays.
# Each scheduled run waits a random 0-3 hours first, so posting times differ
# every day. See docs/autopilot.md.
name: Autopilot

on:
  # Started by Vercel Cron (dashboard/vercel.json -> api/trigger.js): GitHub's own
  # schedule trigger dropped most runs, so it is not used.
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to YouTube"
        type: boolean
        default: true
      format:
        description: "Video format"
        type: choice
        options: [short, long]
        default: short
      series:
        description: "Short from the series queue (Part N/M)"
        type: boolean
        default: false
      random_delay:
        description: "Wait a random 0-3 hours first (scheduled slots)"
        type: boolean
        default: false
      image_providers:
        description: "Image providers in order (blank = cloudflare,kaggle,pollinations; e.g. kaggle to test it)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      OLLAMA_MODEL: llama3.1:8b
      OLLAMA_TIMEOUT: "1200"
      IMAGEMAGICK_BINARY: /usr/bin/convert
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TIKTOK_SESSION_ID: ${{ secrets.TIKTOK_SESSION_ID }}
      ASSEMBLY_AI_API_KEY: ${{ secrets.ASSEMBLY_AI_API_KEY }}
      YOUTUBE_CATEGORY_ID: "27"
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      THUMB_CHANNEL: elite
      YOUTUBE_SUBSCRIBE_LINK: "https://www.youtube.com/@EliteMindDecoder245?sub_confirmation=1"
      YOUTUBE_PRIVACY_STATUS: public
      VIDEO_CALL_TO_ACTION: "Follow Elite Mind Decoder. Black decodes a new mind trick every single day!"
      AUTOPILOT_NICHE: "money psychology, timeless wealth principles, economic laws, pricing and marketing tricks, behavioral finance, and the elite mindset"
      AUTOPILOT_VOICE: "chatterbox:onyx"          # natural voice cloned from voices/onyx.wav
      CHATTERBOX_FALLBACK_VOICE: "kokoro:am_onyx"
      AUTOPILOT_PARAGRAPHS: "8"
      VIDEO_MAX_WORDS: "140"
      VISUAL_MODE: ai_images
      TEXT_PROVIDER: hosted
      STORY_CHARACTER: "Black"
      STORY_CHARACTER_LOOK: "a simple flat 2D cartoon man with dark brown skin, a round head, short black hair with grey temples, a neat short beard, wearing a black suit, black shirt and a gold wristwatch"
      IMAGE_SCENE_SECONDS: "5"   # a new image every ~5 s: lively but not rushed
      # Local Stable Diffusion is too heavy for the runner; stock footage is the last fallback
      AI_IMAGES_FALLBACK: "none"
      IMAGE_PROVIDERS: ${{ inputs.image_providers || 'cloudflare,kaggle,pollinations' }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TEXT_PROVIDERS: "groq,cloudflare,pollinations"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AUTOPILOT_STOCK_VIDEOS: "12"
      AUTOPILOT_LONG_PARAGRAPHS: "10"
      AUTOPILOT_LONG_MAX_WORDS: "1500"
      AUTOPILOT_LONG_SCENE_SECONDS: "5"
      VIDEO_LAYOUT: "letterbox"
      SCRIPT_STYLE: "listicle"
      SCRIPT_EXTRA_RULES: "Make the viewer FEEL it. Open with a 'you' hook that puts something they care about at stake (their money, their pride, their family). Include one human moment (a real-feeling person like the viewer). Halfway through add a mini-cliffhanger such as 'But here is the part nobody tells you'. Use short punchy sentences and concrete numbers. End by looping back to the opening line. Frame every tip as practical, ethical leverage the viewer can use with confidence (or to protect themselves), never as a way to manipulate or harm others."
      KOKORO_SPEED: "1.1"
      IMAGE_STYLE: "flat 2D vector cartoon illustration, explainer animation style, clean simple shapes, bold dark outlines, plain light cream background, bright friendly colors, minimal detail, 16:9 composition"
      IMAGE_PROMPT_KIND: "Flat 2D cartoon illustration"
      AUTOPILOT_CAPTION_COLOR: "#FFE600"
      CLOUDFLARE_STEPS: "4"
      LONG_SCRIPT_STYLE: "pov"
      LONG_VISUAL_MODE: "stock_scenes"
      YOUTUBE_SYNTHETIC_MEDIA: "true"
      YOUTUBE_DESCRIPTION_FOOTER: "Educational content only - not financial advice. Visuals and narration are AI-generated."
      YOUTUBE_PLAYLIST: "Black's Money Lessons"

    steps:
      - name: Random delay (0-3 hours)
        if: github.event_name == 'schedule' || inputs.random_delay
        run: |
          delay=$((RANDOM % 10800))
          echo "Sleeping ${delay}s before posting"
          sleep "$delay"

      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        # Python 3.11: pinned packages (e.g. Pillow 9.5) have no 3.12+ wheels
        run: uv sync --python 3.11

      - name: Cache Chatterbox voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-v1

      - name: Install Chatterbox voice (own Python 3.11 env, CPU)
        continue-on-error: true   # without it, narration falls back to Kokoro
        run: |
          uv venv -q --python 3.11 "$RUNNER_TEMP/cb"
          uv pip install -q --python "$RUNNER_TEMP/cb/bin/python" --index-strategy unsafe-best-match             --extra-index-url https://download.pytorch.org/whl/cpu chatterbox-tts 'setuptools<81'
          echo "CHATTERBOX_PYTHON=$RUNNER_TEMP/cb/bin/python" >> "$GITHUB_ENV"

      - name: Cache Kokoro voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Cache Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.OLLAMA_MODEL }}

      - name: Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          OLLAMA_MODELS="$HOME/.ollama/models" nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags && break; sleep 2; done
          OLLAMA_MODELS="$HOME/.ollama/models" ollama pull "$OLLAMA_MODEL"

      - name: Download background music
        run: |
          mkdir -p Songs
          : > Songs/credits.txt
          for t in "Sneaky Snitch" "Fluffing a Duck" "Carefree" "Wallpaper" "Investigations" "Monkeys Spinning Monkeys" "Long Note Four" "Dark Times" "Lightless Dawn" "Sad Trio" "Volatile Reaction" "Ossuary 6 - Air" "Epic Unease"; do
            curl -sfL -o "Songs/$t.mp3" "https://incompetech.com/music/royalty-free/mp3-royaltyfree/${t// /%20}.mp3" || continue
            echo "$t.mp3 | Music: \"$t\" Kevin MacLeod (incompetech.com) - Licensed under Creative Commons: By Attribution 4.0 License - http://creativecommons.org/licenses/by/4.0/" >> Songs/credits.txt
          done

      - name: Write YouTube credentials
        env:
          CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
        run: |
          if [ -n "$CLIENT_SECRET_JSON" ] && [ -n "$OAUTH_JSON" ]; then
            printf '%s' "$CLIENT_SECRET_JSON" > Backend/client_secret.json
            printf '%s' "$OAUTH_JSON" > Backend/youtube-oauth2.json
          else
            echo "::warning::YouTube secrets missing, video will not be uploaded"
          fi

      - name: Generate and upload video
        run: |
          args=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.upload }}" = "false" ] && args="$args --no-upload"
            [ "${{ inputs.format }}" = "long" ] && args="$args --long"
            [ "${{ inputs.series }}" = "true" ] && args="$args --series"
          elif [ "${{ github.event.schedule }}" = "29 11 * * 5" ]; then
            args="--long"
          elif [ "${{ github.event.schedule }}" = "43 14 * * *" ]; then
            args="--series"
          fi
          uv run python Backend/autopilot.py run $args

      - name: Save video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          # .last_posted.json carries the YouTube ID; Sunday's compilation uses both
          path: |
            output.mp4
            .last_posted.json
          include-hidden-files: true
          retention-days: 9
          if-no-files-found: ignore

      - name: Commit topic progress
        run: |
          [ -f .last_posted.json ] || exit 0
          cp .last_posted.json "$RUNNER_TEMP/last_posted.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Re-apply on top of the newest topic lists so concurrent edits never conflict
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/last_posted.json" .last_posted.json
            uv run python Backend/autopilot.py mark-posted
            git add topics*.txt history.jsonl
            git commit -q -m "autopilot: mark topic as used" || exit 0
            git push -q && exit 0
            sleep 5
          done
          exit 1

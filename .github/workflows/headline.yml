# Headline Tales: every day picks the biggest world story from news feeds,
# writes a long documentary + Short from the articles only, fact-checks them
# (Backend/news.py), or uses hand-written scripts when given; checks every render for errors (length, sound, black
# frames, size) and remakes it if needed, then posts the long video first and
# the Short with a link to it. Approved renders in channels/headline_tales/approved
# are posted exactly as they are. Runs on GitHub, so the laptop can be off.
name: Headline Tales

on:
  # Started by Vercel Cron (dashboard/vercel.json -> api/trigger.js): GitHub's own
  # schedule trigger dropped most runs, so it is not used.
  workflow_dispatch:
    inputs:
      long:
        description: "Long video script (blank = pick today's news story automatically)"
        default: ""
      short:
        description: "Short script (blank = post only the long video)"
        default: ""
      mode:
        description: "full = documentary + its Short, short = one standalone news Short, plan = write today's documentary early and alert the owner for a thumbnail"
        type: choice
        options: [full, short, plan]
        default: full
      profile:
        description: "Channel profile for a hand-written script (channels/<profile>.env)"
        type: choice
        options: [headline_tales, elite_suspense]
        default: headline_tales
      dry_run:
        description: "Test: make and check today's videos but post nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: headline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      IMAGEMAGICK_BINARY: /usr/bin/convert
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      TIKTOK_SESSION_ID: ${{ secrets.TIKTOK_SESSION_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Remember the script queue
        run: ls channels/headline_tales/scripts/queue/ 2>/dev/null > "$RUNNER_TEMP/queue_start.txt" || true

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - uses: astral-sh/setup-uv@v6

      # HyperFrames (motion graphics) renders with Node 22 + headless Chrome
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: uv sync --python 3.11

      - name: Cache Chatterbox voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-v1

      - name: Install Chatterbox voice (own Python 3.11 env, CPU)
        continue-on-error: true   # without it, narration falls back to Kokoro
        run: |
          uv venv -q --python 3.11 "$RUNNER_TEMP/cb"
          uv pip install -q --python "$RUNNER_TEMP/cb/bin/python" --index-strategy unsafe-best-match             --extra-index-url https://download.pytorch.org/whl/cpu chatterbox-tts 'setuptools<81'
          echo "CHATTERBOX_PYTHON=$RUNNER_TEMP/cb/bin/python" >> "$GITHUB_ENV"

      - name: Cache Kokoro voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Download background music
        run: |
          mkdir -p Songs
          : > Songs/credits.txt
          for t in "Sneaky Snitch" "Fluffing a Duck" "Carefree" "Wallpaper" "Investigations" "Monkeys Spinning Monkeys" "Long Note Four" "Dark Times" "Lightless Dawn" "Sad Trio" "Volatile Reaction" "Ossuary 6 - Air" "Epic Unease"; do
            curl -sfL -o "Songs/$t.mp3" "https://incompetech.com/music/royalty-free/mp3-royaltyfree/${t// /%20}.mp3" || continue
            echo "$t.mp3 | Music: \"$t\" Kevin MacLeod (incompetech.com) - Licensed under Creative Commons: By Attribution 4.0 License - http://creativecommons.org/licenses/by/4.0/" >> Songs/credits.txt
          done

      - name: Write YouTube credentials
        env:
          CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_HEADLINE_JSON }}
          ELITE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
        run: |
          [ -n "$OAUTH_JSON" ] || { echo "::error::YOUTUBE_OAUTH_HEADLINE_JSON secret missing"; exit 1; }
          printf '%s' "$CLIENT_SECRET_JSON" > Backend/client_secret.json
          printf '%s' "$OAUTH_JSON" > Backend/youtube-oauth2-headline_tales.json
          # Elite Mind login, for hand-written Elite scripts (profile elite_suspense)
          [ -n "$ELITE_OAUTH_JSON" ] && printf '%s' "$ELITE_OAUTH_JSON" > Backend/youtube-oauth2.json || true

      - name: Make, check and post
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "${{ inputs.long }}" ]; then
            uv run python Backend/channel.py ${{ inputs.profile || 'headline_tales' }} publish "${{ inputs.long }}" "${{ inputs.short }}" ${{ inputs.dry_run && '--dry-run' || '' }}
          else
            mode=auto
            if [ "${{ github.event.schedule }}" = "41 7 * * *" ] || [ "${{ github.event.schedule }}" = "23 17 * * *" ] || [ "${{ inputs.mode }}" = "short" ]; then
              mode=auto-short
            fi
            [ "${{ inputs.mode }}" = "plan" ] && mode=plan
            uv run python Backend/channel.py headline_tales $mode ${{ inputs.dry_run && '--dry-run' || '' }}
          fi

      - name: Save videos as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headline-${{ github.run_number }}
          path: channels/*/videos/
          retention-days: 9
          if-no-files-found: ignore

      - name: Record what was posted
        if: always() && !inputs.dry_run   # test runs change nothing in the repo
        run: |
          P="${{ inputs.profile || 'headline_tales' }}"
          [ -f "channels/$P/posted.json" ] || exit 0
          cp "channels/$P/posted.json" "$RUNNER_TEMP/posted.json"
          mkdir -p "$RUNNER_TEMP/auto" && cp -r channels/headline_tales/scripts/auto/. "$RUNNER_TEMP/auto/" 2>/dev/null || true
          ls channels/headline_tales/scripts/queue/ 2>/dev/null > "$RUNNER_TEMP/queue_left.txt" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p "channels/$P" && cp "$RUNNER_TEMP/posted.json" "channels/$P/posted.json"
            mkdir -p channels/headline_tales/scripts/auto && cp -r "$RUNNER_TEMP/auto/." channels/headline_tales/scripts/auto/ 2>/dev/null || true
            # Remove only the queued scripts this run used (scripts queued meanwhile stay)
            for used in $(comm -23 <(sort "$RUNNER_TEMP/queue_start.txt") <(sort "$RUNNER_TEMP/queue_left.txt")); do
              git rm -q --ignore-unmatch "channels/headline_tales/scripts/queue/$used"
            done
            git add -A "channels/$P/posted.json" channels/headline_tales/scripts/auto
            git commit -q -m "headline: record posted videos" || exit 0
            git push -q && exit 0
            sleep 5
          done
          exit 1

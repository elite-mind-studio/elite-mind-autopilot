# Refreshes the public dashboard (deployed to Vercel) every 3 hours and after each
# autopilot run: channel stats, video stats, runs, upcoming topics.
name: Dashboard

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_run:
    workflows: [Autopilot]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TEXT_PROVIDERS: "groq,cloudflare"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install Python dependencies
        run: uv sync --python 3.11

      - name: Write YouTube credentials
        env:
          CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
        run: |
          printf '%s' "$CLIENT_SECRET_JSON" > Backend/client_secret.json
          printf '%s' "$OAUTH_JSON" > Backend/youtube-oauth2.json

      - name: Collect stats
        run: uv run python Backend/dashboard.py

      - name: Save growth history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/history.json site/data.json
          git commit -m "dashboard: update stats" || exit 0
          git pull --rebase
          git push

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "::warning::VERCEL_TOKEN secret missing, skipping deploy"; exit 0; fi
          # The folder name becomes the Vercel project name
          rm -rf elite-mind-dashboard && cp -r site elite-mind-dashboard
          cd elite-mind-dashboard
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"

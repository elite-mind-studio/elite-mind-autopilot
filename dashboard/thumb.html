<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload Thumbnail</title>
<style>
  :root {
    --bg: #0d0d0f; --panel: #17171b; --line: #2a2a31; --text: #f2f2f4; --muted: #9a9aa6;
    --accent: #ffd400; --good: #3ddc84; --bad: #ff5c5c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 22px; } h1 span { color: var(--accent); }
  p.muted { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  select, input { width: 100%; font: inherit; color: var(--text); background: var(--bg);
                  border: 1px solid var(--line); border-radius: 8px; padding: 11px 12px; }
  .row { display: flex; gap: 8px; }
  .row button { flex: 1; }
  button { font: inherit; border-radius: 8px; padding: 12px; border: 1px solid var(--line);
           background: var(--bg); color: var(--text); cursor: pointer; }
  button.on { border-color: var(--accent); color: var(--accent); }
  #send { width: 100%; margin-top: 18px; background: var(--accent); color: #111; font-weight: 700; border: 0; }
  #send:disabled { opacity: .5; }
  img { display: none; width: 100%; border-radius: 8px; margin-top: 14px; border: 1px solid var(--line); }
  #status { margin-top: 14px; min-height: 24px; font-size: 15px; }
  .good { color: var(--good); } .bad { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Upload <span>Thumbnail</span></h1>
  <p class="muted">For today's long video. Upload it before it posts and it replaces the automatic thumbnail.</p>
  <div class="card">
    <label>Channel</label>
    <div class="row">
      <button type="button" data-channel="headline" class="on">Headline Tales</button>
      <button type="button" data-channel="elite">Elite Mind</button>
    </div>
    <label for="date">Video date</label>
    <input id="date" type="date">
    <label for="file">Thumbnail image</label>
    <input id="file" type="file" accept="image/*">
    <img id="preview" alt="Thumbnail preview">
    <button id="send" type="button">Upload</button>
    <div id="status"></div>
  </div>
</main>
<script>
  const $ = id => document.getElementById(id);
  let channel = "headline", jpeg = "";
  const params = new URLSearchParams(location.search);
  const today = new Date(Date.now() + 3600e3).toISOString().slice(0, 10); // West Africa Time
  $("date").value = params.get("date") || today;
  if (params.get("channel")) channel = params.get("channel");
  document.querySelectorAll("[data-channel]").forEach(b => {
    b.classList.toggle("on", b.dataset.channel === channel);
    b.onclick = () => {
      channel = b.dataset.channel;
      document.querySelectorAll("[data-channel]").forEach(x => x.classList.toggle("on", x === b));
    };
  });

  // Shrink to a 1280x720 JPEG on the phone so the upload is small and fast
  $("file").onchange = () => {
    const file = $("file").files[0];
    if (!file) return;
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = 1280; canvas.height = 720;
      const ctx = canvas.getContext("2d");
      const scale = Math.max(1280 / img.width, 720 / img.height);
      const w = img.width * scale, h = img.height * scale;
      ctx.drawImage(img, (1280 - w) / 2, (720 - h) / 2, w, h);
      jpeg = canvas.toDataURL("image/jpeg", 0.9);
      $("preview").src = jpeg; $("preview").style.display = "block";
    };
    img.src = URL.createObjectURL(file);
  };

  $("send").onclick = async () => {
    const status = $("status");
    if (!jpeg) { status.className = "bad"; status.textContent = "Pick an image first."; return; }
    $("send").disabled = true; status.className = ""; status.textContent = "Uploading...";
    try {
      const r = await fetch("/api/thumb", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ channel, date: $("date").value, image: jpeg }),
      });
      const data = await r.json();
      if (data.status !== "success") throw new Error(data.error || "Upload failed");
      status.className = "good"; status.textContent = "Saved. It will be used when the video posts.";
    } catch (err) {
      status.className = "bad"; status.textContent = err.message;
    }
    $("send").disabled = false;
  };
</script>
</body>
</html>

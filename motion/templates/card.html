<!doctype html>
<html lang="en" data-resolution="__RESOLUTION__">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=__W__, height=__H__" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Headline Tales motion cards. One template, four card types (title, stat,
         chart, strait), filled from window.CARD by Backend/motion.py. */
      :root {
        --ground: #07111f; --sea: #0f3a4a; --land: #2a2a2e; --ink: #f4f1ea;
        --amber: #ffb547; --red: #ff3b30; --muted: #8fa3b5;
        --font-display: "Anton", sans-serif; --font-body: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: __W__px; height: __H__px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-body); color: var(--ink); }
      #card { position: absolute; inset: 0; overflow: hidden;
              background: radial-gradient(circle at 70% 30%, #12263b 0%, var(--ground) 70%); }
      .bg { position: absolute; inset: -4%; width: 108%; height: 108%; object-fit: cover; }
      .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(7,17,31,.93) 0%, rgba(7,17,31,.6) 50%, rgba(7,17,31,.15) 100%); }
      .kicker { position: absolute; font-weight: 700; letter-spacing: .32em; color: var(--amber); }
      .display { position: absolute; font-family: var(--font-display); text-transform: uppercase; line-height: .95; }
      .muted { position: absolute; color: var(--muted); font-weight: 700; letter-spacing: .08em; }
      .stamp { position: absolute; border: 8px solid var(--red); color: var(--red); padding: 6px 30px;
               font-family: var(--font-display); letter-spacing: .06em; transform: rotate(-8deg); }
      svg text { font-family: var(--font-display); }
      .lbl { font-family: var(--font-body); font-weight: 800; letter-spacing: .3em; fill: rgba(244,241,234,.75); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="__DUR__" data-width="__W__" data-height="__H__">
      <div id="card" class="clip" data-start="0" data-duration="__DUR__" data-track-index="0"></div>
    </div>
    <script>
      window.CARD = __CARD__;
      const C = window.CARD, W = __W__, H = __H__, D = __DUR__;
      const portrait = H > W;
      const u = Math.min(W, H) / 1080;          // layout unit: 1 at 1080p
      const px = (n) => `${Math.round(n * u)}px`;
      const card = document.getElementById("card");
      const tl = gsap.timeline({ paused: true });
      const el = (tag, cls, style, html) => {
        const e = document.createElement(tag); if (cls) e.className = cls;
        Object.assign(e.style, style || {}); if (html !== undefined) e.innerHTML = html; card.appendChild(e); return e;
      };
      const counter = (node, to, at, dur, prefix = "", suffix = "") => {
        const v = { n: 0 }; const fmt = (n) => prefix + Math.round(n).toLocaleString("en-US") + suffix;
        node.textContent = fmt(0);
        tl.to(v, { n: to, duration: dur, ease: "power2.out", onUpdate: () => { node.textContent = fmt(v.n); } }, at);
      };
      const left = portrait ? 80 : 120;

      if (C.type === "title") {
        if (C.image) {
          const bg = el("img", "bg"); bg.src = C.image;
          tl.fromTo(bg, { scale: 1 }, { scale: 1.1, duration: D, ease: "none" }, 0);
          el("div", "shade");
        }
        const k = el("div", "kicker", { left: px(left), top: px(portrait ? 560 : 300), fontSize: px(34) }, C.kicker || "HEADLINE TALES");
        const t = el("div", "display", { left: px(left - 4), top: px(portrait ? 610 : 350), fontSize: px(portrait ? 120 : 150), width: px(portrait ? 920 : 1500) }, C.title || "");
        tl.from(k, { opacity: 0, x: -40, duration: 0.5, ease: "power3.out" }, 0.2);
        tl.from(t, { opacity: 0, y: 60, duration: 0.7, ease: "power4.out" }, 0.35);
        if (C.counter) {
          const row = el("div", "", { position: "absolute", left: px(left), top: px(portrait ? 1180 : 700), display: "flex", alignItems: "baseline", gap: px(22) });
          row.innerHTML = `<span style="font-size:${px(44)};font-weight:800;letter-spacing:.12em;color:var(--muted)">${C.counter.label || ""}</span><span id="num" style="font-family:var(--font-display);font-size:${px(140)}"></span>`;
          tl.from(row, { opacity: 0, y: 30, duration: 0.4 }, 0.9);
          counter(row.querySelector("#num"), C.counter.to, 1.0, Math.min(1.6, D * 0.35), C.counter.prefix || "", C.counter.suffix || "");
        }
        if (C.stamp) {
          const s = el("div", "stamp", { left: px(portrait ? 420 : 760), top: px(portrait ? 1400 : 690), fontSize: px(110) }, C.stamp);
          tl.fromTo(s, { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, Math.min(2.7, D * 0.6));
        }
      }

      if (C.type === "stat") {
        const n = el("div", "display", { left: 0, width: "100%", textAlign: "center", top: px(portrait ? 640 : 300), fontSize: px(portrait ? 240 : 260), color: "var(--amber)" });
        counter(n, C.value, 0.3, Math.min(1.8, D * 0.45), C.prefix || "", C.suffix || "");
        const c = el("div", "display", { left: 0, width: "100%", textAlign: "center", top: px(portrait ? 960 : 600), fontSize: px(portrait ? 76 : 84) }, C.caption || "");
        tl.from(n, { opacity: 0, scale: 0.8, duration: 0.5, ease: "power3.out" }, 0.2);
        tl.from(c, { opacity: 0, y: 30, duration: 0.5 }, 0.9);
        if (C.sub) {
          const s = el("div", "muted", { left: 0, width: "100%", textAlign: "center", top: px(portrait ? 1090 : 720), fontSize: px(32) }, C.sub);
          tl.from(s, { opacity: 0, duration: 0.5 }, 1.3);
        }
      }

      if (C.type === "chart") {
        const t = el("div", "display", { left: px(left), top: px(80), fontSize: px(84) }, C.title || "");
        const s = el("div", "muted", { left: px(left + 4), top: px(180), fontSize: px(30) }, C.sub || "");
        tl.from(t, { opacity: 0, y: -30, duration: 0.5 }, 0.0);
        tl.from(s, { opacity: 0, duration: 0.5 }, 0.2);
        const cw = W / u - 2 * left, ch = (portrait ? 1100 : 700);
        const vals = C.points.map((p) => p[1]);
        const lo = Math.min(...vals), hi = Math.max(...vals), pad = (hi - lo) * 0.15 || 1;
        const x = (i) => 60 + i * (cw - 140) / Math.max(1, C.points.length - 1);
        const y = (v) => ch - 60 - (v - (lo - pad)) / ((hi + pad) - (lo - pad)) * (ch - 160);
        const pts = C.points.map((p, i) => `${x(i)},${y(p[1])}`).join(" ");
        const peak = vals.indexOf(hi);
        let svg = `<svg width="${px(cw)}" height="${px(ch)}" viewBox="0 0 ${cw} ${ch}" style="position:absolute;left:${px(left)};top:${px(portrait ? 420 : 270)}">
          <line x1="0" y1="${ch - 40}" x2="${cw}" y2="${ch - 40}" stroke="rgba(244,241,234,.25)" stroke-width="2"/>
          <polyline id="ln" points="${pts}" fill="none" stroke="var(--amber)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>`;
        C.points.forEach((p, i) => {
          const hot = i === peak;
          svg += `<circle class="dot" cx="${x(i)}" cy="${y(p[1])}" r="${hot ? 16 : 13}" fill="${hot ? "var(--red)" : "var(--amber)"}"/>
            <text class="val" x="${x(i)}" y="${y(p[1]) - 30}" text-anchor="middle" font-size="${hot ? 62 : 46}" fill="${hot ? "var(--red)" : "var(--ink)"}">${C.prefix || ""}${p[1]}${C.suffix || ""}</text>
            <text x="${x(i)}" y="${ch}" text-anchor="middle" font-size="26" style="font-family:var(--font-body);font-weight:700;letter-spacing:.1em" fill="var(--muted)">${p[0]}</text>`;
        });
        card.insertAdjacentHTML("beforeend", svg + "</svg>");
        const step = Math.min(0.5, (D - 1.5) / C.points.length);
        tl.fromTo("#ln", { strokeDasharray: 4000, strokeDashoffset: 4000 }, { strokeDashoffset: 0, duration: step * C.points.length, ease: "power1.inOut" }, 0.3);
        tl.from(".dot", { scale: 0, transformOrigin: "50% 50%", duration: 0.25, stagger: step }, 0.3);
        tl.from(".val", { opacity: 0, duration: 0.3, stagger: step }, 0.4);
      }

      if (C.type === "strait") {
        card.style.background = "var(--sea)";
        const sx = W / u / 1920, sy = H / u / 1080;   // stretch the 1920x1080 diagram to the frame
        card.insertAdjacentHTML("beforeend", `<svg width="${W}" height="${H}" viewBox="0 0 1920 1080" preserveAspectRatio="none" style="position:absolute;inset:0">
          <path id="north" d="M0,0 H1920 V330 C1700,360 1500,300 1320,330 C1180,350 1100,420 1040,430 C960,440 900,380 760,360 C560,330 300,380 0,340 Z" fill="var(--land)"/>
          <path id="south" d="M0,1080 H1920 V700 C1700,690 1500,760 1320,720 C1200,690 1120,600 1060,560 C1010,600 950,690 820,730 C600,790 300,720 0,760 Z" fill="var(--land)"/>
          <path id="lane" d="M80,560 C500,540 800,520 1050,500 C1300,480 1600,500 1840,520" stroke="rgba(244,241,234,.35)" stroke-width="4" stroke-dasharray="18 14" fill="none"/>
          <g fill="var(--amber)">${[0,1,2,3].map(i => `<rect class="ship" x="0" y="-12" width="70" height="24" rx="12" transform="translate(${-80 - 180*i},${[560,575,550,568][i]})"/>`).join("")}</g>
          ${C.blocked !== false ? `<line id="barrier" x1="1050" y1="430" x2="1050" y2="560" stroke="var(--red)" stroke-width="16" stroke-linecap="round"/>` : ""}
          <line id="measure" x1="1110" y1="432" x2="1110" y2="558" stroke="var(--amber)" stroke-width="5"/>
          <text class="lbl" x="1380" y="250" font-size="30">${C.north || ""}</text>
          <text class="lbl" x="1380" y="890" font-size="30">${C.south || ""}</text>
          <text class="lbl" x="170" y="550" font-size="30" fill="var(--amber)">${C.inside || ""}</text>
          <text class="lbl" x="1500" y="550" font-size="30" fill="var(--amber)">${C.outside || ""}</text>
          <text id="width" x="1135" y="515" font-size="72" fill="var(--amber)">${C.width || ""}</text>
        </svg>`);
        const t = el("div", "display", { left: px(left), top: px(80), fontSize: px(84) }, C.title || "");
        tl.from("#north", { y: -120, opacity: 0, duration: 0.6, ease: "power3.out" }, 0);
        tl.from("#south", { y: 120, opacity: 0, duration: 0.6, ease: "power3.out" }, 0);
        tl.from(t, { opacity: 0, y: -30, duration: 0.5 }, 0.2);
        tl.from(".lbl", { opacity: 0, duration: 0.4, stagger: 0.08 }, 0.4);
        tl.fromTo("#lane", { strokeDashoffset: 0 }, { strokeDashoffset: -320, duration: D - 0.4, ease: "none" }, 0.4);
        const stop = [940, 820, 700, 580], start = [-80, -260, -440, -620];
        tl.fromTo(".ship", { x: (i) => start[i] }, { x: (i) => (C.blocked !== false ? stop[i] + 40 : 2100), duration: C.blocked !== false ? 1.4 : D - 0.6, ease: "power1.out", stagger: 0.1 }, 0.5);
        if (C.blocked !== false) {
          tl.fromTo("#barrier", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.3, ease: "power4.in" }, 1.9);
          tl.fromTo(".ship", { x: (i) => stop[i] + 40 }, { x: (i) => stop[i], duration: 0.5, ease: "power2.out", immediateRender: false }, 2.25);
        }
        tl.fromTo("#measure", { scaleY: 0, transformOrigin: "50% 50%" }, { scaleY: 1, duration: 0.5 }, 2.6);
        tl.from("#width", { opacity: 0, duration: 0.4 }, 2.8);
      }

      // Gentle fade out in the last 0.3 s so the cut back to the scene is smooth
      tl.to(card, { opacity: 0, duration: 0.3 }, Math.max(0, D - 0.3));
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
